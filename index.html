<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#5b3a21">
<title>臭狗熊养成 🐻</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:#3d2a1a;overflow:hidden;-webkit-tap-highlight-color:transparent;}
body{
  background:
    radial-gradient(ellipse at top,#87ceeb 0%,transparent 60%),
    linear-gradient(180deg,#a8e063 0%,#56ab2f 100%);
  display:flex;justify-content:center;align-items:stretch;
  min-height:100vh;
}
#app{
  width:100%;max-width:480px;min-height:100vh;
  background:linear-gradient(180deg,#fff9ef 0%,#fce8c6 40%,#e8c494 100%);
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;
  box-shadow:0 0 40px rgba(0,0,0,.2);
}
/* ===== 顶部状态栏 ===== */
#topbar{
  padding:12px 14px 8px;display:flex;align-items:center;gap:10px;
  background:linear-gradient(180deg,rgba(91,58,33,.85),rgba(91,58,33,.5));
  color:#fff;position:relative;z-index:5;
}
#topbar .title{font-size:15px;font-weight:700;flex:1;text-shadow:0 1px 2px rgba(0,0,0,.4);}
#topbar .title span{color:#ffd93d;font-size:12px;font-weight:500;margin-left:4px;}
#topbar .lv{
  background:#ffd93d;color:#5b3a21;border-radius:12px;padding:2px 10px;font-size:12px;font-weight:700;
}
#stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:6px 10px 10px;background:rgba(91,58,33,.3);}
.stat{
  background:rgba(255,255,255,.9);border-radius:10px;padding:4px 6px;font-size:11px;
  display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;
  box-shadow:0 2px 4px rgba(0,0,0,.15);transition:transform .2s;
}
.stat.bump{transform:scale(1.15);}
.stat .icon{font-size:16px;line-height:1;}
.stat .num{font-weight:700;color:#5b3a21;font-size:12px;}
.bar{position:absolute;bottom:0;left:0;height:3px;background:linear-gradient(90deg,#ff6b6b,#ffe66d,#6bcb77);border-radius:0 0 10px 10px;transition:width .3s;}

/* ===== 舞台 ===== */
#stage{
  flex:1;position:relative;display:flex;justify-content:center;align-items:flex-end;
  padding-bottom:20px;min-height:300px;overflow:hidden;
  background:
    linear-gradient(180deg,transparent 60%,rgba(91,58,33,.15) 100%),
    repeating-linear-gradient(90deg,#90c66d 0 10px,#85b862 10px 20px);
}
#clouds{position:absolute;top:5px;left:0;right:0;height:60px;pointer-events:none;}
.cloud{position:absolute;top:10px;font-size:30px;opacity:.7;animation:drift 30s linear infinite;}
.cloud:nth-child(1){left:-30px;animation-duration:45s;}
.cloud:nth-child(2){left:150px;font-size:22px;animation-duration:60s;animation-delay:-20s;top:25px;}
.cloud:nth-child(3){left:300px;font-size:26px;animation-duration:50s;animation-delay:-35s;top:5px;}
@keyframes drift{0%{transform:translateX(-50px);}100%{transform:translateX(500px);}}

#bearWrap{position:relative;width:180px;height:200px;transition:transform .3s;}
.bear{transform-origin:bottom center;}
/* 动作动画 */
.anim-eat .bear{animation:eat .35s ease-in-out 5;}
.anim-cute .bear{animation:cute .5s ease-in-out 3;}
.anim-hit .bear{animation:hit .15s ease-in-out 6;}
.anim-travel .bear{animation:spinY .8s ease-in-out 2;}
.anim-study .bear{animation:sway .5s ease-in-out 3;}
.anim-work .bear{animation:bop .3s ease-in-out 6;}
.anim-sleep .bear{animation:breathe 2s ease-in-out infinite;}
.anim-play .bear{animation:jump .5s ease-in-out 3;}
.anim-bath .bear{animation:wash .4s ease-in-out 5;}
@keyframes eat{0%,100%{transform:scale(1,1);} 50%{transform:scale(1.05,.95);}}
@keyframes cute{0%,100%{transform:rotate(0);} 25%{transform:rotate(-8deg) translateY(-6px);} 75%{transform:rotate(8deg) translateY(-6px);}}
@keyframes hit{0%,100%{transform:translateX(0);} 50%{transform:translateX(-12px) rotate(-5deg);}}
@keyframes spinY{0%{transform:rotateY(0) scale(1);} 50%{transform:rotateY(180deg) scale(1.1);} 100%{transform:rotateY(360deg) scale(1);}}
@keyframes sway{0%,100%{transform:rotate(-3deg);} 50%{transform:rotate(3deg);}}
@keyframes bop{0%,100%{transform:translateY(0);} 50%{transform:translateY(-4px) scale(1.03);}}
@keyframes breathe{0%,100%{transform:scale(1);} 50%{transform:scale(1.02,1.03);}}
@keyframes jump{0%,100%{transform:translateY(0);} 40%{transform:translateY(-40px) rotate(-5deg);} 70%{transform:translateY(0) scale(.97,1.04);}}
@keyframes wash{0%,100%{transform:rotate(0);} 25%{transform:rotate(-10deg);} 75%{transform:rotate(10deg);}}

/* 心情装饰 */
.deco{position:absolute;font-size:28px;pointer-events:none;opacity:0;transition:opacity .3s;}
.deco.bubble{opacity:1;top:-10px;left:50%;transform:translateX(-50%);}
.deco.shit{opacity:1;top:-20px;right:-15px;font-size:22px;}
.deco.vein{opacity:1;top:10px;left:-10px;font-size:22px;animation:shake .3s infinite;}
.deco.tear{opacity:1;top:60px;left:15px;font-size:20px;animation:drip 1.2s infinite;}
@keyframes shake{0%,100%{transform:translateX(0) rotate(-10deg);}50%{transform:translateX(2px) rotate(-5deg);}}
@keyframes drip{0%,100%{transform:translateY(0);}50%{transform:translateY(6px);}}

/* 对话气泡 */
#speech{
  position:absolute;top:10px;left:50%;transform:translateX(-50%) scale(.8);
  background:#fff;color:#5b3a21;padding:8px 14px;border-radius:16px;
  font-size:13px;max-width:200px;text-align:center;line-height:1.4;
  box-shadow:0 3px 10px rgba(0,0,0,.2);opacity:0;transition:all .25s;
  z-index:10;pointer-events:none;
}
#speech.show{opacity:1;transform:translateX(-50%) scale(1);}
#speech::after{
  content:'';position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);
  border-left:8px solid transparent;border-right:8px solid transparent;border-top:8px solid #fff;
}

/* 飘字 */
.fx{position:absolute;font-size:24px;pointer-events:none;font-weight:700;animation:fxUp 1.4s ease-out forwards;z-index:20;}
.fx.pos{color:#ff6b35;text-shadow:0 0 8px #fff;}
.fx.neg{color:#c0392b;text-shadow:0 0 8px #fff;}
@keyframes fxUp{0%{opacity:0;transform:translateY(0) scale(.6);} 20%{opacity:1;transform:translateY(-10px) scale(1.2);} 100%{opacity:0;transform:translateY(-90px) scale(.9);}}

/* ===== 底部按钮 ===== */
#actions{
  padding:10px 10px 20px;background:rgba(91,58,33,.25);
  display:grid;grid-template-columns:repeat(3,1fr);gap:7px;
  backdrop-filter:blur(4px);
}
.btn{
  border:none;background:#fff;color:#5b3a21;border-radius:12px;padding:8px 4px;
  font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;
  cursor:pointer;transition:all .15s;box-shadow:0 2px 6px rgba(0,0,0,.15);
  position:relative;overflow:hidden;
}
.btn:active{transform:scale(.92);background:#ffd93d;}
.btn .em{font-size:22px;line-height:1;}
.btn .cost{font-size:10px;color:#888;font-weight:400;}
.btn.locked{opacity:.45;}
.btn.locked::after{
  content:'🔒';position:absolute;top:2px;right:2px;font-size:10px;
}

/* 成就提示 */
#achToast{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.5);
  background:linear-gradient(135deg,#ffd93d,#ff9a3c);color:#5b3a21;
  padding:20px 30px;border-radius:16px;font-size:14px;font-weight:700;
  box-shadow:0 8px 30px rgba(0,0,0,.4);opacity:0;pointer-events:none;
  z-index:100;text-align:center;
  border:3px solid #fff;
}
#achToast.show{animation:achPop 2.2s ease forwards;}
@keyframes achPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5);} 20%{opacity:1;transform:translate(-50%,-50%) scale(1.05);} 30%{transform:translate(-50%,-50%) scale(1);} 85%{opacity:1;transform:translate(-50%,-50%) scale(1);} 100%{opacity:0;transform:translate(-50%,-60%) scale(.9);}}

/* 弹窗 */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;justify-content:center;align-items:center;z-index:200;}
.modal-mask.show{display:flex;}
.modal{background:#fff;border-radius:16px;padding:20px;max-width:400px;width:90%;max-height:80vh;overflow-y:auto;}
.modal h2{color:#5b3a21;margin-bottom:12px;}
.modal ul{list-style:none;}
.modal li{padding:6px 0;border-bottom:1px dashed #eee;font-size:13px;display:flex;align-items:center;gap:8px;}
.modal li.done{color:#6bcb77;}
.modal li .ach-icon{font-size:20px;}
.modal .close-btn{
  display:block;margin:16px auto 0;border:none;background:#5b3a21;color:#fff;
  padding:8px 24px;border-radius:20px;font-size:14px;cursor:pointer;
}

/* 菜单按钮 */
#menu{
  position:absolute;top:12px;right:10px;display:flex;gap:6px;z-index:6;
}
.menu-btn{
  background:rgba(255,255,255,.9);border:none;border-radius:50%;width:30px;height:30px;
  font-size:15px;cursor:pointer;box-shadow:0 2px 4px rgba(0,0,0,.2);
}
.menu-btn:active{transform:scale(.9);}

/* 页脚 */
#footer{text-align:center;font-size:10px;color:rgba(91,58,33,.6);padding:6px;}

/* 掉落金币 */
.coin-rain{position:absolute;font-size:18px;animation:coinFall 2s linear forwards;pointer-events:none;}
@keyframes coinFall{0%{transform:translateY(-40px);opacity:0;} 10%{opacity:1;} 100%{transform:translateY(400px);opacity:0;}}
</style>
</head>

<script>
/* ===== 存档 ===== */
const KEY='chouxiong_save_v1';
const S=JSON.parse(localStorage.getItem(KEY))||{
  love:50,hate:0,food:70,energy:80,coin:100,
  level:1,ach:{},feedCount:0,hitCount:0,playTime:0
};

const ACHIEVEMENTS={
  firstFeed:{icon:'🍖',name:'初次投喂',desc:'第一次给臭狗熊吃东西'},
  firstHit:{icon:'👊',name:'揍过熊',desc:'敲过臭狗熊一次'},
  firstWork:{icon:'💼',name:'打工熊',desc:'让臭狗熊打工赚过钱'},
  firstTravel:{icon:'✈️',name:'世界那么大',desc:'带臭狗熊出去旅游'},
  loveMax:{icon:'💖',name:'熊生挚爱',desc:'好感度达到100'},
  hateMax:{icon:'😈',name:'彻底仇恨',desc:'仇恨值达到100'},
  coin1k:{icon:'💰',name:'小富翁',desc:'金币累计超过1000'},
  lv5:{icon:'⭐',name:'资深熊奴',desc:'达到等级5'},
  bath10:{icon:'🛁',name:'香噗噗',desc:'洗澡10次'},
  play20:{icon:'🎮',name:'玩熊大师',desc:'和臭狗熊玩20次'}
};
if(!S.ach)S.ach={};if(!S.feedCount)S.feedCount=0;if(!S.hitCount)S.hitCount=0;if(!S.playTime)S.playTime=0;if(!S.bathCount)S.bathCount=0;

function save(){localStorage.setItem(KEY,JSON.stringify(S));}
function clamp(v){return Math.max(0,Math.min(100,v));}

/* ===== 等级 ===== */
function calcLevel(){
  const exp=S.feedCount*5+S.playTime*3+Object.keys(S.ach).length*10+Math.floor(S.coin/10);
  S.level=Math.min(10,1+Math.floor(exp/30));
}

/* ===== 台词 ===== */
const LINES={

  sleep:['zzz… 做个好梦…','唔… 好困…','梦里有蜂蜜…','晚安晚安… 别吵我！','哼… 我睡了…','💤 zzz…']
};
const RANDOM_LOG=['今天臭狗熊偷偷去摘了蜂蜜🍯','臭狗熊把你家冰箱翻了个底朝天','臭狗熊和隔壁的小狗打了一架','臭狗熊在沙发上踩奶','臭狗熊藏了零食在沙发缝里','臭狗熊偷偷看你手机（熊也要学手机）','臭狗熊被蜜蜂叮了个包🐝'];

/* ===== 数值变化 ===== */
function statsDelta(changes,msg){
  const parts=[];
  for(const k in changes){
    const d=changes[k];S[k]=clamp(S[k]+d);
    const el=document.getElementById('n-'+k);
    if(el){
      const before=+el.textContent;
      const after=clamp(before+d);
      el.textContent=S[k];
      const parent=el.closest('.stat');
      parent.classList.add('bump');
      setTimeout(()=>parent.classList.remove('bump'),200);
      // 进度条
      if(k!=='coin'){
        parent.querySelector('.bar').style.width=S[k]+'%';
      }
    }
    if(d!==0){
      const iconMap={love:'💕',hate:'💢',food:'🍖',energy:'⚡',coin:'💰'};
      parts.push((d>0?'+':'')+d+iconMap[k]);
    }
  }
  return parts.join(' ')+(msg?' · '+msg:'');
}

/* ===== 飘字/反馈 ===== */
function fx(txt,kind){
  const s=document.getElementById('stage');
  for(let i=0;i<5;i++){
    setTimeout(()=>{
      const f=document.createElement('div');
      f.className='fx '+(kind||'pos');
      f.textContent=txt[Math.floor(Math.random()*txt.length)];
      f.style.left=(80+Math.random()*200)+'px';
      f.style.top=(180+Math.random()*40)+'px';
      s.appendChild(f);
      setTimeout(()=>f.remove(),1500);
    },i*250);
  }
}
function coinRain(){
  const s=document.getElementById('stage');
  for(let i=0;i<8;i++){
    setTimeout(()=>{
      const c=document.createElement('div');
      c.className='coin-rain';
      c.textContent='💰';
      c.style.left=(50+Math.random()*300)+'px';
      s.appendChild(c);
      setTimeout(()=>c.remove(),2200);
    },i*100);
  }
}
function say(msg){
  const sp=document.getElementById('speech');
  sp.textContent=msg;
  sp.classList.add('show');
  clearTimeout(sp._t);
  sp._t=setTimeout(()=>sp.classList.remove('show'),2200);
}

/* ===== 动画 ===== */
let lock=false;
function anim(name,dur){
  lock=true;
  const stage=document.getElementById('stage');
  stage.className='anim-'+name;
  setTimeout(()=>{stage.className='';lock=false;},dur);
}

/* ===== 心情系统 ===== */
function updateMood(){
  const wrap=document.getElementById('bearWrap');
  wrap.className='';
  if(S.hate>=60||S.love<=15){
    wrap.classList.add('angry');
    // 生气：墨镜歪了，嘴角下弯，青筋暴起
    document.getElementById('glasses').style.transform='rotate(10deg)';
    document.getElementById('mouth').setAttribute('d','M85 135 Q100 125 115 135');
    document.getElementById('cig').style.display='none';
    document.getElementById('deco-vein').classList.add('vein');
    document.getElementById('deco-tear').classList.remove('tear');
    document.getElementById('deco-shit').classList.remove('shit');
    document.getElementById('deco-bubble').classList.remove('bubble');
    document.getElementById('blushL').setAttribute('opacity',0);
    document.getElementById('blushR').setAttribute('opacity',0);
  }else if(S.love>=75){
    wrap.classList.add('happy');
    // 开心：墨镜歪一边，嘴角上翘，卖萌粉腮红
    document.getElementById('glasses').style.transform='rotate(-15deg) translateY(-3px)';
    document.getElementById('mouth').setAttribute('d','M85 132 Q100 148 115 132');
    document.getElementById('cig').style.display='';
    document.getElementById('deco-vein').classList.remove('vein');
    document.getElementById('deco-tear').classList.remove('tear');
    document.getElementById('deco-shit').classList.remove('shit');
    document.getElementById('deco-bubble').classList.add('bubble');
    document.getElementById('blushL').setAttribute('opacity',0.7);
    document.getElementById('blushR').setAttribute('opacity',0.7);
  }else if(S.food<=15||S.energy<=15){
    wrap.classList.add('sad');
    // 委屈：墨镜掉下来，眼泪汪汪
    document.getElementById('glasses').style.transform='translateY(8px)';
    document.getElementById('mouth').setAttribute('d','M85 138 Q100 130 115 138');
    document.getElementById('cig').style.display='none';
    document.getElementById('deco-vein').classList.remove('vein');
    document.getElementById('deco-tear').classList.add('tear');
    document.getElementById('deco-shit').classList.remove('shit');
    document.getElementById('deco-bubble').classList.remove('bubble');
    document.getElementById('blushL').setAttribute('opacity',0);
    document.getElementById('blushR').setAttribute('opacity',0);
  }else{
    wrap.classList.add('normal');
    // 正常：痞坏笑
    document.getElementById('glasses').style.transform='rotate(-3deg)';
    document.getElementById('mouth').setAttribute('d','M85 128 Q100 138 115 128');
    document.getElementById('cig').style.display='';
    document.getElementById('deco-vein').classList.remove('vein');
    document.getElementById('deco-tear').classList.remove('tear');
    document.getElementById('deco-shit').classList.remove('shit');
    document.getElementById('deco-bubble').classList.remove('bubble');
    document.getElementById('blushL').setAttribute('opacity',0.3);
    document.getElementById('blushR').setAttribute('opacity',0.3);
  }
}

/* ===== 成就 ===== */
const unlockedAch=new Set(Object.keys(S.ach));
function checkAch(){
  const checks={
    firstFeed:()=>S.feedCount>=1,
    firstHit:()=>S.hitCount>=1,
    firstWork:()=>S.workCount>=1,
    firstTravel:()=>S.travelCount>=1,
    loveMax:()=>S.love>=100,
    hateMax:()=>S.hate>=100,
    coin1k:()=>S.coin>=1000,
    lv5:()=>S.level>=5,
    bath10:()=>S.bathCount>=10,
    play20:()=>S.playTime>=20
  };
  Object.keys(checks).forEach(k=>{
    if(!unlockedAch.has(k)&&checks[k]()){
      unlockedAch.add(k);S.ach[k]=1;save();
      toastAch(ACHIEVEMENTS[k].icon+' '+ACHIEVEMENTS[k].name+'\n'+ACHIEVEMENTS[k].desc);
    }
  });
}
function toastAch(txt){
  const t=document.getElementById('achToast');
  t.textContent=txt;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

/* ===== 主交互 ===== */
const STAGE=document.getElementById('stage');
function act(a){
  if(lock)return;
  // 条件检查
  if(a==='feed'&&S.coin<15)return say('老板你钱不够啊喂！');
  if(a==='travel'&&S.coin<30)return say('30块都不给我？还想旅游？');
  if(a==='bath'&&S.coin<5)return say('连洗澡钱都没有？你比我还惨');
  if(a==='work'&&S.energy<20)return say('累死了累死了… 让我歇会儿');
  if(a==='study'&&S.energy<15)return say('头好痛… 学不动了');
  if(a==='play'&&S.energy<8)return say('没精力玩了… 呜呜呜');
  if(a==='cute'&&S.energy<5)return say('好没精神… 卖不动萌了');
  if(a==='sleep'&&S.energy>=100)return say('我精神得很！睡个屁！');
  if(a==='work'&&S.food<10)return say('饿着肚子打工你是人吗！');
  if(a==='play'&&S.food<5)return say('饿的没力气玩了…');

  let msg='';
  if(a==='feed'){
    const gain=10+Math.floor(Math.random()*8);
    msg=statsDelta({coin:-15,food:gain,love:clamp(S.love+4)-S.love,hate:clamp(S.hate-3)-S.hate},RANDOM_LOG[Math.floor(Math.random()*RANDOM_LOG.length)])
      +'\n'+rnd(LINES.feed);
    S.feedCount=(S.feedCount||0)+1;fx(['+'+gain+'🍖','💕','-15💰'],null);anim('eat',2000);
  }else if(a==='cute'){
    msg=statsDelta({energy:-5,love:clamp(S.love+3)-S.love,hate:clamp(S.hate-2)-S.hate},rnd(LINES.cute));
    fx(['🥰','💕'],null);anim('cute',1500);
  }else if(a==='hit'){
    msg=statsDelta({love:clamp(S.love-6)-S.love,hate:clamp(S.hate+5)-S.hate,energy:-3},rnd(LINES.hit));
    S.hitCount=(S.hitCount||0)+1;
    if(S.hate>=80&&Math.random()<.3){
      // 反杀！
      S.love=clamp(S.love-10);
      msg+='\n💥 臭狗熊扑上来揍了你！你掉了 -10 好感！';
      say('别跑！ 看我不揍你狗主人！');
    }else{
      say(rnd(LINES.hit));
    }
    fx(['-6💕','💢'],'neg');anim('hit',1000);
  }else if(a==='travel'){
    const loc=['北京吃烤鸭','成都火锅','海边沙滩','爬长城','游乐园','大草原','香港逛街','哈尔滨看雪'];
    msg=statsDelta({coin:-30,energy:-10,love:clamp(S.love+8)-S.love,hate:clamp(S.hate-4)-S.hate},rnd(LINES.travel)+' · 目的地：'+rnd(loc));
    S.travelCount=(S.travelCount||0)+1;fx(['✈️','+8💕','-30💰'],null);anim('travel',1800);
  }else if(a==='study'){
    const earn=20+Math.floor(Math.random()*15);
    msg=statsDelta({energy:-15,coin:earn,love:clamp(S.love-1)-S.love},rnd(LINES.study));
    fx(['📚','+'+earn+'💰']);anim('study',1500);
  }else if(a==='work'){
    const earn=25+Math.floor(Math.random()*20);
    msg=statsDelta({energy:-20,food:-5,coin:earn},rnd(LINES.work));
    S.workCount=(S.workCount||0)+1;coinRain();anim('work',1600);
  }else if(a==='play'){
    const loveGain=Math.floor(Math.random()*4)+2;
    msg=statsDelta({energy:-8,food:-3,love:clamp(S.love+loveGain)-S.love,hate:clamp(S.hate-2)-S.hate},rnd(LINES.play));
    S.playTime=(S.playTime||0)+1;fx(['🎮','+'+loveGain+'💕'],null);anim('play',1800);
  }else if(a==='bath'){
    msg=statsDelta({coin:-5,energy:-5,food:clamp(S.food-2)-S.food,love:clamp(S.love+3)-S.love,hate:clamp(S.hate-3)-S.hate},rnd(LINES.bath));
    S.bathCount=(S.bathCount||0)+1;fx(['🛁','🫧','💕'],null);anim('bath',1800);
  }else if(a==='sleep'){
    const gain=Math.min(45,100-S.energy);
    msg=statsDelta({energy:gain},rnd(LINES.sleep));
    STAGE.classList.add('sleeping');
    anim('sleep',3500);
    setTimeout(()=>STAGE.classList.remove('sleeping'),3500);
  }else return;
  say(rnd(LINES[a]||['嗯~']));
  calcLevel();
  document.getElementById('levelTag').textContent='Lv.'+S.level;
  setTimeout(()=>updateMood(),50);
  checkAch();save();
}
function rnd(arr){return arr[Math.floor(Math.random()*arr.length)];}

/* ===== 绑定按钮 ===== */
document.querySelectorAll('.btn').forEach(b=>{
  b.addEventListener('click',()=>act(b.dataset.act));
});

/* ===== 成就弹窗 ===== */
document.getElementById('achBtn').addEventListener('click',()=>{
  const list=document.getElementById('achList');list.innerHTML='';
  Object.keys(ACHIEVEMENTS).forEach(k=>{
    const d=ACHIEVEMENTS[k];

  });
  document.getElementById('achModal').classList.add('show');
});
document.getElementById('achClose').addEventListener('click',()=>{
  document.getElementById('achModal').classList.remove('show');
});
document.getElementById('achModal').addEventListener('click',e=>{

document.getElementById('resetBtn').addEventListener('click',()=>{

  localStorage.removeItem(KEY);location.reload();

/* ===== 自动饥饿/精力衰减（每 30 秒） ===== */
setInterval(()=>{
  S.food=clamp(S.food-1);
  S.energy=clamp(S.energy-0.5);
  if(S.food<30&&Math.random()<.15)say('饿了饿了… 什么时候开饭？');
  if(S.energy<30&&Math.random()<.15)say('好累… 让我躺会儿…');
  save();renderStats();
},30000);

function renderStats(){
  document.getElementById('n-love').textContent=S.love;
  document.getElementById('n-hate').textContent=S.hate;
  document.getElementById('n-food').textContent=S.food;
  document.getElementById('n-energy').textContent=Math.round(S.energy);
  document.getElementById('n-coin').textContent=S.coin;
  document.querySelectorAll('.stat').forEach(el=>{
    const k=el.dataset.s;
    if(k!=='coin')el.querySelector('.bar').style.width=S[k]+'%';
  });
}

calcLevel();
document.getElementById('levelTag').textContent='Lv.'+S.level;
renderStats();
updateMood();
checkAch();
